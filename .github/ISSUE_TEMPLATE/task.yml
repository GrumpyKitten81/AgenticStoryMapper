name: Plan a task
description: Define a bounded change to code, documentation or tooling.
body:
  - type: markdown
    attributes:
      value: |
        Keep secrets, personal information and private Project data out of public issues.
        For security concerns, read SECURITY.md in the repository root; do not submit vulnerability details here.
  - id: change
    type: textarea
    attributes:
      label: Intended change
      description: Explain the work to carry out and why it is needed.
    validations:
      required: true
  - id: completion
    type: textarea
    attributes:
      label: Completion check
      description: State the observable result and how someone can verify it.
    validations:
      required: true
  - id: constraints
    type: textarea
    attributes:
      label: Constraints and links (optional)
      description: Add boundaries, dependencies or references needed to carry out the task.
