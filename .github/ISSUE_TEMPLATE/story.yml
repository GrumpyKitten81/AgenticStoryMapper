name: Plan a User Story
description: Describe a small deliverable user outcome independently of map placement.
body:
  - type: markdown
    attributes:
      value: |
        Keep secrets, personal information and private Project data out of public issues.
        For security concerns, read SECURITY.md in the repository root; share only a sanitized summary without confidential exploit details.
        Planning type does not assign a Story Map level or a native GitHub Issue type.
  - id: outcome
    type: textarea
    attributes:
      label: User story
      description: Explain who needs what outcome and why. Keep it small enough to deliver and review independently.
    validations:
      required: true
  - id: acceptance
    type: textarea
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must hold for this User Story to be accepted.
    validations:
      required: true
  - id: context
    type: textarea
    attributes:
      label: Context and references (optional)
      description: Add relevant examples, dependencies, related planning items and source links.
