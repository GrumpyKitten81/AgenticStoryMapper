name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: CI
    env:
      npm_config_store_dir: ${{ github.workspace }}/../pnpm-store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ github.workspace }}/../pnpm-store
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Provision Corepack
        run: npm install --global --force corepack@0.35.0
      - name: Verify root runtime and pnpm pin
        run: node --input-type=module -e "import { runtime } from './scripts/runtime.mjs'; await runtime();"
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build native SQLite for this runner
        run: corepack pnpm --filter @storymapper/db rebuild better-sqlite3
      - name: Construct native SQLite database
        run: corepack pnpm --filter @storymapper/db exec node --input-type=module -e "import Database from 'better-sqlite3'; const db = new Database(':memory:'); db.prepare('SELECT 1').get(); db.close();"
      - name: Detect lockfile changes
        id: lockfile
        run: |
          git diff --name-only HEAD^1 HEAD -- pnpm-lock.yaml > "$RUNNER_TEMP/lockfile-diff"
          if test -s "$RUNNER_TEMP/lockfile-diff"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report dependency audit safely
        if: steps.lockfile.outputs.changed == 'true'
        run: node scripts/ci-audit.mjs
      - name: Run bounded product checks
        run: corepack pnpm check:ci
